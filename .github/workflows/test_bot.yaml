name: Test Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: test_questions, diag, report, review or mp
        default: test_questions
      mp_id:
        description: Market Pulse tournament id/slug for mode=mp
        default: ''
      reforecast_hours:
        description: hours before re-forecasting
        default: ''
      tier:
        description: test_questions tier (base or main)
        default: 'base'
      limit:
        description: test_questions max questions (0 = all)
        default: '0'

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      # Adding the below will make the workflow faster, but will mean you don't automatically get updates from forecasting-tools and other packages
      # - name: Load cached venv
      #   id: cached-poetry-dependencies
      #   uses: actions/cache@v4
      #   with:
      #     path: .venv
      #     key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot
        run: |
          poetry run python main.py --mode ${{ inputs.mode || 'test_questions' }}
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FORECAST_MODELS: ${{ vars.FORECAST_MODELS }}
          PREDICTIONS_PER_REPORT: ${{ vars.PREDICTIONS_PER_REPORT }}
          FORECAST_MODELS_MAIN: ${{ vars.FORECAST_MODELS_MAIN }}
          PREDICTIONS_PER_REPORT_MAIN: ${{ vars.PREDICTIONS_PER_REPORT_MAIN }}
          SEARCH_MODEL_MAIN: ${{ vars.SEARCH_MODEL_MAIN }}
          SEARCH_MAX_USES_MAIN: ${{ vars.SEARCH_MAX_USES_MAIN }}
          TEST_TIER: ${{ inputs.tier }}
          TEST_LIMIT: ${{ inputs.limit }}
          SEARCH_MODEL: ${{ vars.SEARCH_MODEL }}
          SEARCH_MAX_USES: ${{ vars.SEARCH_MAX_USES }}
          MARKET_PULSE_ID: ${{ inputs.mp_id || vars.MARKET_PULSE_ID }}
          REFORECAST_HOURS: ${{ inputs.reforecast_hours || vars.REFORECAST_HOURS }}
          EXTREMIZE: ${{ vars.EXTREMIZE }}
          DEFAULT_MODEL: ${{ vars.DEFAULT_MODEL }}
          AUX_MODEL: ${{ vars.AUX_MODEL }}
          RESEARCH_MODEL: ${{ vars.RESEARCH_MODEL }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_API_KEY: ${{ secrets.ASKNEWS_API_KEY }}